name: Deploy SINERGI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy Backend Go (Koyeb)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Koyeb API token
        id: check_koyeb
        run: |
          if [ -n "${{ secrets.KOYEB_API_TOKEN }}" ] && [ -n "${{ secrets.KOYEB_SERVICE_NAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Koyeb deploy: KOYEB_API_TOKEN atau KOYEB_SERVICE_NAME belum dikonfigurasi."
          fi

      - name: Install Koyeb CLI
        if: steps.check_koyeb.outputs.enabled == 'true'
        uses: koyeb-community/koyeb-actions@v2
        with:
          api-token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Redeploy Koyeb Service
        if: steps.check_koyeb.outputs.enabled == 'true'
        run: koyeb service redeploy "${{ secrets.KOYEB_SERVICE_NAME }}"
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Smoke test API /healthz
        if: ${{ vars.API_PRODUCTION_URL != '' }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "${{ vars.API_PRODUCTION_URL }}/healthz"

  deploy-web:
    name: Deploy Frontend Next.js (Cloudflare Workers)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare token
        id: check_cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy: CLOUDFLARE_API_TOKEN atau CLOUDFLARE_ACCOUNT_ID belum dikonfigurasi."
          fi

      - name: Setup pnpm
        if: steps.check_cf.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        if: steps.check_cf.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.check_cf.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext Cloudflare Worker
        if: steps.check_cf.outputs.enabled == 'true'
        run: pnpm --filter web build:cf
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_PRODUCTION_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.WEB_PRODUCTION_URL }}

      - name: Deploy to Cloudflare Workers
        if: steps.check_cf.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_PRODUCTION_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.WEB_PRODUCTION_URL }}

      - name: Smoke test Web /api/health
        if: ${{ vars.WEB_PRODUCTION_URL != '' }}
        run: |
          curl --fail --retry 3 --retry-delay 5 "${{ vars.WEB_PRODUCTION_URL }}/api/health"
